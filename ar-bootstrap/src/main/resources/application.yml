# AR Bootstrap - multi-tenant backend
# Secrets: prefer env vars (see .env.example). Defaults are for local only.
quarkus:
  application:
    name: invoice-genie-ar
  http:
    port: ${QUARKUS_HTTP_PORT:8080}
    host: 0.0.0.0
  datasource:
    db-kind: postgresql
    username: ${QUARKUS_DATASOURCE_USERNAME:ar}
    password: ${QUARKUS_DATASOURCE_PASSWORD:ar}
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/invoicegenie}
      max-size: ${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:32}
  hibernate-orm:
    database:
      generation: none
    log:
      sql: false
  flyway:
    migrate-at-start: ${QUARKUS_FLYWAY_MIGRATE_AT_START:true}
    baseline-on-migrate: true
    locations: db/migration
  index-dependency:
    ar-domain:
      group-id: com.invoicegenie
      artifact-id: ar-domain
    ar-adapter-api:
      group-id: com.invoicegenie
      artifact-id: ar-adapter-api
    ar-adapter-messaging:
      group-id: com.invoicegenie
      artifact-id: ar-adapter-messaging
    ar-adapter-persistence:
      group-id: com.invoicegenie
      artifact-id: ar-adapter-persistence
  # Kafka Dev Services off by default (no Docker required)
  kafka:
    devservices:
      enabled: false
  swagger-ui:
    always-include: true
  micrometer:
    export:
      prometheus:
        enabled: true
        path: /q/metrics
  otel:
    enabled: ${QUARKUS_OTEL_ENABLED:false}
    exporter:
      otlp:
        endpoint: ${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  log:
    level: INFO
    category:
      "com.invoicegenie":
        level: DEBUG
      "org.jboss.resteasy.reactive.server.handlers":
        level: DEBUG
      "io.quarkus.arc":
        level: INFO
    console:
      enable: true
      # Keep plain text in non-prod; JSON only on %prod (quarkus-logging-json present)
      json: false
      format: "%d{HH:mm:ss.SSS} [%t] %-5p %c{2} - %s%e%n"
    file:
      enable: true
      path: logs/invoicegenie.log
      format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{2} - %s%e%n"
      rotation:
        max-file-size: 10M
        max-backup-index: 5

# Customer HTTP webhooks (STORY-009) — delivery after outbox publish
webhook:
  delivery:
    enabled: ${WEBHOOK_DELIVERY_ENABLED:true}
    timeout-ms: ${WEBHOOK_DELIVERY_TIMEOUT_MS:5000}
    max-attempts: ${WEBHOOK_DELIVERY_MAX_ATTEMPTS:5}
    retry-interval: ${WEBHOOK_DELIVERY_RETRY_INTERVAL:30s}
    retry-batch: ${WEBHOOK_DELIVERY_RETRY_BATCH:50}

# API security (disabled by default for local/dev/test)
# mode: api-key | jwt | hybrid | oidc | hybrid-oidc
invoicegenie:
  security:
    enabled: ${INVOICEGENIE_SECURITY_ENABLED:false}
    mode: ${INVOICEGENIE_SECURITY_MODE:api-key}
    # Format: apiKey:tenantUuid,otherKey:otherTenantUuid
    api-keys: ${INVOICEGENIE_API_KEYS:none}
    # Web users: username:password:tenantUuid:ROLE1|ROLE2 (comma-separated)
    users: ${INVOICEGENIE_SECURITY_USERS:none}
    jwt:
      secret: ${INVOICEGENIE_JWT_SECRET:none}
      # Access JWT lifetime (default 15 minutes)
      access-ttl-seconds: ${INVOICEGENIE_JWT_ACCESS_TTL_SECONDS:900}
      # Refresh token lifetime (default 7 days) — stored hashed in DB with rotation
      refresh-ttl-seconds: ${INVOICEGENIE_JWT_REFRESH_TTL_SECONDS:604800}
      # Legacy alias (prefer access-ttl-seconds)
      ttl-seconds: ${INVOICEGENIE_JWT_TTL_SECONDS:900}
    # OIDC resource-server path (PP-020): JWKS RS256 validation when mode=oidc|hybrid-oidc
    oidc:
      issuer: ${INVOICEGENIE_OIDC_ISSUER:none}
      audience: ${INVOICEGENIE_OIDC_AUDIENCE:none}
      jwks-uri: ${INVOICEGENIE_OIDC_JWKS_URI:none}
      tenant-claim: ${INVOICEGENIE_OIDC_TENANT_CLAIM:tenant_id}
      roles-claim: ${INVOICEGENIE_OIDC_ROLES_CLAIM:groups}
    # First-boot admin (only when ar_app_user is empty)
    bootstrap:
      email: ${INVOICEGENIE_BOOTSTRAP_EMAIL:admin@invoicegenie.local}
      password: ${INVOICEGENIE_BOOTSTRAP_PASSWORD:Admin123!}
      display-name: ${INVOICEGENIE_BOOTSTRAP_DISPLAY_NAME:System Admin}
      tenant-id: ${INVOICEGENIE_BOOTSTRAP_TENANT_ID:00000000-0000-0000-0000-000000000001}
    allow-openapi: ${INVOICEGENIE_SECURITY_ALLOW_OPENAPI:true}
  # PP-024: allow cross-currency allocation via exchange rates (default reject)
  payments:
    allow-fx-allocation: ${INVOICEGENIE_PAYMENTS_ALLOW_FX_ALLOCATION:false}
  # Cheque OCR (STORY-018) — reject bulk create when ocrConfidence is present and below this floor
  ocr:
    min-confidence: ${INVOICEGENIE_OCR_MIN_CONFIDENCE:0.45}
  # STORY-015: dunning policy (days past due → levels 1..N)
  dunning:
    enabled: ${INVOICEGENIE_DUNNING_ENABLED:true}
    levels: ${INVOICEGENIE_DUNNING_LEVELS:30,60,90}
    job-interval: ${INVOICEGENIE_DUNNING_JOB_INTERVAL:1h}
  # STORY-019: allocation vs amountPaid reconciliation
  allocation-reconcile:
    enabled: ${INVOICEGENIE_ALLOCATION_RECONCILE_ENABLED:true}
    interval: ${INVOICEGENIE_ALLOCATION_RECONCILE_INTERVAL:6h}
  # Customer notifications (Email + WhatsApp) — P0 MVP
  notifications:
    enabled: ${INVOICEGENIE_NOTIFICATIONS_ENABLED:true}
    # Log full destination/body only when true (QA-NOTIFY-003 — default redacted)
    log-payloads: ${INVOICEGENIE_NOTIFICATIONS_LOG_PAYLOADS:false}
    # Manual send rate limit per tenant (QA-NOTIFY-014)
    send-rate-per-minute: ${INVOICEGENIE_NOTIFICATIONS_SEND_RATE_PER_MINUTE:30}
    email:
      enabled: ${INVOICEGENIE_NOTIFICATIONS_EMAIL_ENABLED:true}
      provider: ${INVOICEGENIE_NOTIFICATIONS_EMAIL_PROVIDER:logging}
    whatsapp:
      enabled: ${INVOICEGENIE_NOTIFICATIONS_WHATSAPP_ENABLED:false}
      provider: ${INVOICEGENIE_NOTIFICATIONS_WHATSAPP_PROVIDER:logging}
    pre-due-days: ${INVOICEGENIE_NOTIFICATIONS_PRE_DUE_DAYS:3}
    max-attempts: ${INVOICEGENIE_NOTIFICATIONS_MAX_ATTEMPTS:5}
    dispatch:
      interval: ${INVOICEGENIE_NOTIFICATIONS_DISPATCH_INTERVAL:15s}
      batch: ${INVOICEGENIE_NOTIFICATIONS_DISPATCH_BATCH:50}
    reminder:
      job-interval: ${INVOICEGENIE_NOTIFICATIONS_REMINDER_JOB_INTERVAL:1h}
    smtp:
      # Use "none" not empty — SmallRye rejects empty String defaults
      host: ${INVOICEGENIE_SMTP_HOST:none}
      port: ${INVOICEGENIE_SMTP_PORT:587}
      username: ${INVOICEGENIE_SMTP_USERNAME:none}
      password: ${INVOICEGENIE_SMTP_PASSWORD:none}
      from: ${INVOICEGENIE_SMTP_FROM:noreply@invoicegenie.local}
      starttls: ${INVOICEGENIE_SMTP_STARTTLS:true}
    whatsapp-meta:
      access-token: ${INVOICEGENIE_WHATSAPP_ACCESS_TOKEN:none}
      phone-number-id: ${INVOICEGENIE_WHATSAPP_PHONE_NUMBER_ID:none}
      api-version: ${INVOICEGENIE_WHATSAPP_API_VERSION:v18.0}

# Local / developer profile — PostgreSQL only (Docker: docker compose up -d postgres).
# Preferred: -Dquarkus.profile=dev
"%dev":
  quarkus:
    http:
      port: 8080
      host: 0.0.0.0
    datasource:
      db-kind: postgresql
      username: ${QUARKUS_DATASOURCE_USERNAME:ar}
      password: ${QUARKUS_DATASOURCE_PASSWORD:ar}
      jdbc:
        url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/invoicegenie}
    hibernate-orm:
      database:
        generation: none
    flyway:
      migrate-at-start: true
      baseline-on-migrate: true
    kafka:
      devservices:
        enabled: false
    index-dependency:
      ar-domain:
        group-id: com.invoicegenie
        artifact-id: ar-domain
      ar-adapter-api:
        group-id: com.invoicegenie
        artifact-id: ar-adapter-api
      ar-adapter-messaging:
        group-id: com.invoicegenie
        artifact-id: ar-adapter-messaging
      ar-adapter-persistence:
        group-id: com.invoicegenie
        artifact-id: ar-adapter-persistence
      ar-application:
        group-id: com.invoicegenie
        artifact-id: ar-application
  invoicegenie:
    security:
      # Local console: JWT users (DB) + API keys for M2M
      enabled: true
      mode: hybrid
      api-keys: "dev-local-key:00000000-0000-0000-0000-000000000001"
      jwt:
        secret: "dev-only-jwt-secret-change-me"
        access-ttl-seconds: 900
        refresh-ttl-seconds: 604800
      bootstrap:
        email: admin@invoicegenie.local
        password: Admin123!
        display-name: System Admin
        tenant-id: "00000000-0000-0000-0000-000000000001"
      allow-openapi: true

# Test profile — PostgreSQL via Quarkus Dev Services (Docker required for @QuarkusTest)
"%test":
  quarkus:
    http:
      port: 8080
      host: 0.0.0.0
    datasource:
      db-kind: postgresql
      # No fixed JDBC URL: Dev Services starts an ephemeral Postgres for tests
      devservices:
        enabled: true
        image-name: postgres:15-alpine
        db-name: invoicegenie_test
        username: ar
        password: ar
    hibernate-orm:
      database:
        generation: none
    flyway:
      migrate-at-start: true
      baseline-on-migrate: true
    kafka:
      devservices:
        enabled: false
    index-dependency:
      ar-domain:
        group-id: com.invoicegenie
        artifact-id: ar-domain
      ar-adapter-api:
        group-id: com.invoicegenie
        artifact-id: ar-adapter-api
      ar-adapter-messaging:
        group-id: com.invoicegenie
        artifact-id: ar-adapter-messaging
      ar-adapter-persistence:
        group-id: com.invoicegenie
        artifact-id: ar-adapter-persistence
      ar-application:
        group-id: com.invoicegenie
        artifact-id: ar-application
  invoicegenie:
    security:
      enabled: false

# Production profile: secrets required, Flyway on, OpenAPI locked down, auth on
"%prod":
  quarkus:
    hibernate-orm:
      database:
        generation: none
    flyway:
      migrate-at-start: true
      baseline-on-migrate: true
    swagger-ui:
      enable: false
      always-include: false
    smallrye-openapi:
      enable: false
    log:
      level: INFO
      category:
        "com.invoicegenie":
          level: INFO
      console:
        json: ${QUARKUS_LOG_CONSOLE_JSON:true}
      file:
        enable: false
  invoicegenie:
    security:
      enabled: true
      mode: ${INVOICEGENIE_SECURITY_MODE:api-key}
      allow-openapi: false

# Kafka connectors (optional - enable in production with Kafka running)
# Uncomment when Kafka is available AND outbox.kafka-enabled=true:
# mp.messaging.outgoing.invoice-issued:
#   connector: smallrye-kafka
#   topic: ar.invoice.issued
#   value.serializer: org.apache.kafka.common.serialization.StringSerializer

# mp.messaging.outgoing.outbox-events:
