# Test configuration for QuarkusTest — PostgreSQL only (Dev Services / Docker)
quarkus:
  http:
    port: 0  # random available port for tests
  datasource:
    db-kind: postgresql
    devservices:
      enabled: true
      image-name: postgres:15-alpine
      db-name: invoicegenie_test
      username: ar
      password: ar
  hibernate-orm:
    database:
      generation: none
    log:
      sql: false
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
  log:
    level: WARN
  kafka:
    devservices:
      enabled: false

# Disable outbox worker in tests (no Kafka)
outbox:
  enabled: false
  kafka-enabled: false