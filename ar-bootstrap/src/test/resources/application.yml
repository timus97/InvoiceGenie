# Test configuration for QuarkusTest - uses H2 in-memory DB
quarkus:
  http:
    port: 0  # random available port for tests
  datasource:
    db-kind: h2
    username: sa
    # SmallRye rejects empty String as null — use non-empty for Quarkus 3.27+
    password: sa
    jdbc:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
      driver: org.h2.Driver
  hibernate-orm:
    database:
      generation: update  # create schema from entities
    log:
      sql: false
  log:
    level: WARN
  kafka:
    devservices:
      enabled: false
  devservices:
    enabled: false

# Disable outbox worker in tests (no Kafka)
outbox:
  enabled: false
  kafka-enabled: false